_format_version: "3.0"
_transform: true

consumers:
  - username: jwt-issuer
    jwt_secrets:
      - algorithm: HS256
        key: authentication
        secret: __JWT_SECRET__
  - id: 11111111-1111-1111-1111-111111111111
    username: anonymous

services:
  - name: authentication
    url: http://authentication:8001
    retries: 0
    routes:
      - name: auth-public
        paths:
          - /auth/register
          - /auth/login
        methods:
          - POST
          - OPTIONS
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              policy: local
              second: 30
              minute: 200
              limit_by: ip
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429

  - name: auction-reads
    url: http://auction:8002
    retries: 2
    routes:
      - name: auctions-public-get
        paths:
          - /auctions
        methods:
          - GET
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              header_names:
                - authorization
              anonymous: "11111111-1111-1111-1111-111111111111"
          - name: post-function
            config:
              access:
                - |
                  local function b64url(data)
                    local pad = (4 - #data % 4) % 4
                    data = data:gsub("-", "+"):gsub("_", "/") .. string.rep("=", pad)
                    return ngx.decode_base64(data)
                  end
                  kong.service.request.clear_header("x-user-id")
                  local consumer = kong.client.get_consumer()
                  if not consumer or consumer.username == "anonymous" then return end
                  local auth = kong.request.get_header("authorization")
                  if not auth then return end
                  local token = auth:match("[Bb]earer%s+(.+)")
                  if not token then return end
                  local payload = token:match("^[^%.]+%.([^%.]+)%.")
                  if not payload then return kong.response.exit(401) end
                  local decoded = b64url(payload)
                  if not decoded then return kong.response.exit(401) end
                  local aud = decoded:match('"aud"%s*:%s*"([^"]+)"')
                  if aud ~= "live-auction-platform" then return kong.response.exit(401) end
                  local sub = decoded:match('"sub"%s*:%s*"([^"]+)"')
                  if type(sub) == "string" and sub ~= "" then
                    kong.service.request.set_header("X-User-Id", sub)
                  end
          - name: rate-limiting
            config:
              policy: local
              second: 30
              minute: 200
              limit_by: ip
              fault_tolerant: true
              hide_client_headers: false
              error_code: 429

  - name: auction-writes
    url: http://auction:8002
    retries: 0
    routes:
      - name: auctions-protected-write
        paths:
          - /auctions
        methods:
          - POST
          - PATCH
          - OPTIONS
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              header_names:
                - authorization
          - name: post-function
            config:
