services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentication:
    build: ./authentication
    environment:
      DATABASE_URL: postgresql+asyncpg://authentication:authentication@postgres:5432/authentication
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_ISSUER: ${JWT_ISSUER:-authentication}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-live-auction-platform}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/docs')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  auction:
    build: ./auction
    environment:
      DATABASE_URL: postgresql+asyncpg://auction:auction@postgres:5432/auction
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/docs')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  settlement:
    build: ./settlement
    environment:
      DATABASE_URL: postgresql+asyncpg://settlement:settlement@postgres:5432/settlement
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/docs')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  kong:
    image: kong:3.9
    entrypoint: ["/bin/sh", "/gateway-entrypoint.sh"]
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_NGINX_DAEMON: "off"
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_NGINX_PROXY_PROXY_NEXT_UPSTREAM: error timeout http_502 http_503 http_504
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
      - ./gateway/docker-entrypoint.sh:/gateway-entrypoint.sh:ro
    ports:
      - "8080:8000"
    depends_on:
      authentication:
        condition: service_healthy
      auction:
        condition: service_healthy
      settlement:
        condition: service_healthy

volumes:
  postgres_data:
