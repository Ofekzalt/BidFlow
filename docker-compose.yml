services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentication:
    build: ./authentication
    environment:
      DATABASE_URL: postgresql+asyncpg://authentication:authentication@postgres:5432/authentication
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-authentication}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-live-auction-platform}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/docs')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  auction:
    build: ./auction
    environment:
      DATABASE_URL: postgresql+asyncpg://auction:auction@postgres:5432/auction
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/docs')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  settlement:
    build: ./settlement
    environment:
      DATABASE_URL: postgresql+asyncpg://settlement:settlement@postgres:5432/settlement
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/docs')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  auction-close-worker:
    build: ./auction
    entrypoint: ["uv", "run", "python", "-m", "auction.workers.close_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://auction:auction@postgres:5432/auction
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      auction:
        condition: service_healthy

  auction-outbox-worker:
    build: ./auction
    entrypoint: ["uv", "run", "python", "-m", "auction.workers.outbox_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://auction:auction@postgres:5432/auction
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      auction:
        condition: service_healthy

  auction-eligibility-consumer:
    build: ./auction
    entrypoint: ["uv", "run", "python", "-m", "auction.workers.eligibility_consumer"]
    environment:
      DATABASE_URL: postgresql+asyncpg://auction:auction@postgres:5432/auction
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      auction:
        condition: service_healthy

  auction-payment-result-consumer:
    build: ./auction
    entrypoint: ["uv", "run", "python", "-m", "auction.workers.payment_result_consumer"]
    environment:
      DATABASE_URL: postgresql+asyncpg://auction:auction@postgres:5432/auction
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      auction:
        condition: service_healthy

  settlement-outbox-worker:
    build: ./settlement
    entrypoint: ["uv", "run", "python", "-m", "settlement.workers.outbox_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://settlement:settlement@postgres:5432/settlement
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
    depends_on:
      settlement:
        condition: service_healthy

  settlement-auction-ended-consumer:
    build: ./settlement
    entrypoint: ["uv", "run", "python", "-m", "settlement.workers.auction_ended_consumer"]
    environment:
      DATABASE_URL: postgresql+asyncpg://settlement:settlement@postgres:5432/settlement
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
    depends_on:
      settlement:
        condition: service_healthy

  kong:
    image: kong:3.9
    entrypoint: ["/bin/sh", "/gateway-entrypoint.sh"]
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_NGINX_DAEMON: "off"
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_NGINX_PROXY_PROXY_NEXT_UPSTREAM: error timeout http_502 http_503 http_504
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
      - ./gateway/docker-entrypoint.sh:/gateway-entrypoint.sh:ro
    ports:
      - "8080:8000"
    depends_on:
      authentication:
        condition: service_healthy
      auction:
        condition: service_healthy
      settlement:
        condition: service_healthy

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
    command:
      [
        "sh",
        "-c",
        "npm install && npm install @rollup/rollup-linux-arm64-gnu && npm run dev -- --host 0.0.0.0 --port 5173",
      ]
    depends_on:
      kong:
        condition: service_started

volumes:
  postgres_data:
  frontend_node_modules:
