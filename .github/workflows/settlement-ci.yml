name: settlement-ci

on:
  pull_request:
    branches: [main]
    paths:
      - settlement/**
      - docker-compose.yml
      - scripts/init-databases.sql
      - .github/workflows/**

concurrency:
  group: settlement-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/reusable-python-service.yml
    with:
      working-directory: settlement
      run-tests: true
      needs-rabbitmq: true
      run-migrations: false
      database-url: postgresql+asyncpg://settlement:settlement@localhost:5432/settlement
      rabbitmq-url: amqp://guest:guest@localhost:5672/
